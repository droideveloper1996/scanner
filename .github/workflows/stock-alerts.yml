# Runs the stock alert check every 5 minutes during NSE hours (09:15-15:30 IST = 03:45-10:00 UTC), Monday to Friday.
# Repo secrets: STOCK_TELEGRAM_BOT_TOKEN and STOCK_TELEGRAM_CHAT_ID (falls back to the crypto bot's TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID). Optional repo variable: ALERT_STOCKS (comma separated NSE symbols).
# Alert state (what already fired) is carried between runs in the Actions cache. Free on a public repo.
# Minutes are offset from :00 because GitHub drops or delays more scheduled runs at the top of the hour.
name: stock-alerts
on:
  schedule:
    - cron: '2-59/5 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run outside market hours (for a test)'
        type: boolean
        default: false
      test:
        description: 'Send one sample message to Telegram, then stop'
        type: boolean
        default: false
      replay:
        description: 'Replay the setup detector over past sessions (prints only), then stop'
        type: boolean
        default: false
      setups:
        description: 'Send the setup watchlist for the next session now (does not change alert state)'
        type: boolean
        default: false
      max_price:
        description: 'With setups: only stocks under this price (e.g. 500); empty = all'
        type: string
        default: ''
      digest:
        description: 'Send every personal watchlist digest now, then stop'
        type: boolean
        default: false
      whoami:
        description: 'Print the chat ids of people who messaged the bot, then stop'
        type: boolean
        default: false
concurrency:
  group: bot-state
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude SDK for /ask (only when the key is set)
        working-directory: stocks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: if [ -n "$ANTHROPIC_API_KEY" ]; then npm install --no-save --no-audit --no-fund @anthropic-ai/sdk; fi
      - name: Replay setups
        if: ${{ inputs.replay }}
        working-directory: stocks
        run: npx -y tsx@4 scripts/replay-setups.ts 120
      - name: Send setup watchlist
        if: ${{ inputs.setups }}
        working-directory: stocks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.STOCK_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.STOCK_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          DATA_DIR: .data
          MAX_PRICE: ${{ inputs.max_price }}
        run: npx -y tsx@4 scripts/send-setups.ts "Monday"
      - name: Find my Telegram chat id
        if: ${{ inputs.whoami && !inputs.test }}
        working-directory: stocks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.STOCK_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
        run: npx -y tsx@4 scripts/whoami.ts
      - name: Restore alert state
        if: ${{ !inputs.whoami && !inputs.replay && !inputs.setups }}
        uses: actions/cache/restore@v4
        with:
          path: stocks/.data
          key: stock-alerts-state-${{ github.run_id }}
          restore-keys: stock-alerts-state-
      - name: Send test message
        if: ${{ inputs.test }}
        working-directory: stocks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.STOCK_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.STOCK_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TG_SOURCE: ${{ secrets.STOCK_TELEGRAM_BOT_TOKEN && 'stock bot secrets' || 'crypto bot secrets (fallback)' }}
          SEND_TEST: '1'
          DATA_DIR: .data
        run: npx -y tsx@4 scripts/run-alerts.ts
      - name: Send watchlist digests
        if: ${{ inputs.digest && !inputs.test }}
        working-directory: stocks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.STOCK_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.STOCK_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          WATCH_DIGEST: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASK_MODEL: ${{ vars.ASK_MODEL }}
          DATA_DIR: .data
        run: npx -y tsx@4 scripts/run-alerts.ts
      - name: Run alert check
        if: ${{ !inputs.whoami && !inputs.replay && !inputs.setups && !inputs.test && !inputs.digest }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.STOCK_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.STOCK_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          ALERT_STOCKS: ${{ vars.ALERT_STOCKS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASK_MODEL: ${{ vars.ASK_MODEL }}
          FORCE: ${{ inputs.force && '1' || '' }}
          DATA_DIR: .data
        working-directory: stocks
        run: npx -y tsx@4 scripts/run-alerts.ts
      - name: Save alert state
        if: ${{ !inputs.whoami && !inputs.replay && !inputs.setups }}
        uses: actions/cache/save@v4
        with:
          path: stocks/.data
          key: stock-alerts-state-${{ github.run_id }}-${{ github.run_attempt }}
