# Runs the alert check every 5 minutes on GitHub's own runners. No Vercel or Redis needed.
# Repo secrets: TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID. Optional repo variable: ALERT_COINS.
# Alert state (what already fired) is carried between runs in the Actions cache.
# Every 5 minutes is ~8,700 Actions minutes a month: free on a public repo (this one). If the repo goes private, use '7,37 * * * *' (every 30 min) to stay inside the 2,000 free minutes.
# The pump sleeve of the crypto paper book (paper trades only, never real orders) lives in paper/pump-book.json and is committed when it changes.
# Minutes are offset from :00 because GitHub drops or delays more scheduled runs at the top of the hour.
# GitHub can still start a run several minutes late, and pauses schedules after 60 days without repo activity.
name: crypto-alerts
on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Only send a Telegram test message'
        type: boolean
        default: false
      replay:
        description: 'Replay the daily setup detector (prints only), then stop'
        type: boolean
        default: false
      prebreakout:
        description: 'Backtest the pre-breakout detector on ~5y of KuCoin daily candles (prints only), then stop'
        type: boolean
        default: false
permissions:
  contents: write   # commits paper/pump-book.json when the virtual pump book changes
concurrency:
  group: bot-state
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay setups
        if: ${{ inputs.replay }}
        run: npx -y tsx@4 scripts/replay-setups.ts 120
      - name: Pre-breakout backtest
        if: ${{ inputs.prebreakout }}
        run: |
          python3 research/prebreakout/fetch_kucoin.py /tmp/kc 40
          python3 research/prebreakout/bt_prebreakout.py crypto /tmp/kc --out /tmp/pb.json
          python3 research/prebreakout/bt_features.py crypto /tmp/kc --out /tmp/pbf.json
          python3 -c "import json;r=json.load(open('/tmp/pb.json'));print('EVENTS', json.dumps(r['events']))"
      - name: Restore alert state
        if: ${{ !inputs.replay && !inputs.prebreakout }}
        uses: actions/cache/restore@v4
        with:
          path: .data
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-
      - name: Run alert check
        if: ${{ !inputs.replay && !inputs.prebreakout }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_COINS: ${{ vars.ALERT_COINS }}
          DATA_DIR: .data
        run: npx -y tsx@4 scripts/run-alerts.ts ${{ inputs.test && '--test' || '' }}
      - name: Save alert state
        if: ${{ !inputs.replay && !inputs.prebreakout }}
        uses: actions/cache/save@v4
        with:
          path: .data
          key: alerts-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit pump book
        if: ${{ !inputs.replay && !inputs.prebreakout }}
        run: |
          git add -N paper/pump-book.json 2>/dev/null || true
          if [ -n "$(git status --porcelain paper)" ]; then
            git config user.name "crypto-alerts bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper/pump-book.json
            git commit -m "pump book $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
